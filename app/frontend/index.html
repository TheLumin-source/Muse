  <symbol id="bi-map" viewBox="0 0 24 24"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V3l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></symbol>
  <symbol id="bi-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 7.7-8 9-4.6-1.3-8-4.5-8-9V6z"/></symbol>
  <symbol id="bi-trophy" viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5A3.5 3.5 0 0 0 8.5 11M16 6h3v1.5A3.5 3.5 0 0 1 15.5 11"/><path d="M12 12v4M9 20h6M10 17h4v3h-4z"/></symbol>

  <symbol id="bi-brain" viewBox="0 0 24 24"><path d="M12 5a3 3 0 0 0-5.7-1.3A2.6 2.6 0 0 0 4 7a2.6 2.6 0 0 0 .5 4.5A2.8 2.8 0 0 0 7 16a3 3 0 0 0 5 1z"/><path d="M12 5a3 3 0 0 1 5.7-1.3A2.6 2.6 0 0 1 20 7a2.6 2.6 0 0 1-.5 4.5A2.8 2.8 0 0 1 17 16a3 3 0 0 1-5 1"/></symbol>

  <symbol id="bi-heart" viewBox="0 0 24 24"><path d="M12 20S4 15 4 9.5A3.7 3.7 0 0 1 12 7a3.7 3.7 0 0 1 8 2.5C20 15 12 20 12 20z"/></symbol>
  <symbol id="bi-leaf" viewBox="0 0 24 24"><path d="M4 20C4 11 10 4 20 4c0 10-7 16-16 16z"/><path d="M8 16c3-4 6-6 9-8"/></symbol>

<div id="app">

  <aside id="sidebar">
    <button id="project-switch" class="pswitch" title="Switch project">
      <svg class="ic"><use href="#i-stack"/></svg>
      <span id="project-name">Loading</span>
      <svg class="ic chev"><use href="#i-chev"/></svg>
    </button>
    <div class="side-sub">
      <span>Boards</span>
      <button id="new-root" class="ghost" title="New board">
        <svg class="ic"><use href="#i-plus"/></svg>
      </button>
    </div>
    <div class="side-search">
      <svg class="ic"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search everything" autocomplete="off">
    </div>
    <nav id="tree" class="tree"></nav>
    <div id="results" class="results" hidden></div>
    <div class="side-foot">
      <span id="save-state">Saved</span>
      <button id="trash-btn" hidden>Trash <span id="trash-count"></span></button>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <button id="back" class="ghost" title="Back to the board above" hidden><svg class="ic"><use href="#i-chev"/></svg></button>
      <nav id="crumbs" class="crumbs"></nav>
      <div class="spacer"></div>
      <div class="tb-group">
        <button id="save-now" class="ghost" title="Save now (Ctrl+S)">Save</button>
      </div>
      <div class="tb-group">
        <button id="present" class="ghost" title="Present this board (F5)"><svg class="ic"><use href="#i-play"/></svg></button>
        <button id="export" class="ghost" title="Export as a single HTML file"><svg class="ic"><use href="#i-export"/></svg></button>
      </div>
      <div class="tb-group">
        <button id="undo" class="ghost" title="Undo (Ctrl+Z)"><svg class="ic"><use href="#i-undo"/></svg></button>
        <button id="redo" class="ghost" title="Redo (Ctrl+Shift+Z)"><svg class="ic"><use href="#i-redo"/></svg></button>
      </div>
      <div class="tb-group zoom">
        <button id="zoom-out" class="ghost">&minus;</button>
        <button id="zoom-level" class="ghost" title="Reset zoom">100%</button>
        <button id="zoom-in" class="ghost">+</button>
        <button id="zoom-fit" class="ghost" title="Fit board">Fit</button>
      </div>
      <div class="tb-group">
        <button id="theme" class="ghost" title="Light / dark"><svg class="ic"><use href="#i-moon"/></svg></button>
      </div>
    </header>

    <div id="stage">
      <div id="world">
        <svg id="wires" overflow="visible">
          <defs>
            <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5"
                    markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0L10 5L0 10z" fill="context-stroke"/>
            </marker>
          </defs>
          <g id="wire-layer"></g>
        </svg>
        <div id="layer"></div>
      </div>

      <div id="guides"></div>
      <div id="marquee" hidden></div>
      <div id="drop-hint" hidden><span>Drop to add to the board</span></div>

      <div id="rail" class="rail">
        <button class="tool" data-tool="note" title="Drag onto the board, or click to drop one"><svg class="ic"><use href="#i-note"/></svg><span>Note</span></button>
        <button class="tool" data-tool="todo" title="To-do list"><svg class="ic"><use href="#i-todo"/></svg><span>To-do</span></button>
        <button class="tool" data-tool="text" title="Heading text"><svg class="ic"><use href="#i-text"/></svg><span>Heading</span></button>
        <button class="tool" data-tool="code" title="Code block"><svg class="ic"><use href="#i-code"/></svg><span>Code</span></button>
        <span class="rail-sep"></span>
        <button class="tool" data-tool="image" title="Image"><svg class="ic"><use href="#i-image"/></svg><span>Image</span></button>
        <button class="tool" data-tool="link" title="Web link with preview"><svg class="ic"><use href="#i-link"/></svg><span>Link</span></button>
        <button class="tool" data-tool="file" title="File"><svg class="ic"><use href="#i-file"/></svg><span>File</span></button>
        <span class="rail-sep"></span>
        <button class="tool" data-tool="column" title="Column to group cards"><svg class="ic"><use href="#i-column"/></svg><span>Column</span></button>
        <button class="tool" data-tool="board" title="A board inside this board"><svg class="ic"><use href="#i-board"/></svg><span>Board</span></button>
        <span class="rail-sep"></span>
        <button class="tool" data-tool="live" title="Link a file that stays in sync with the real file"><svg class="ic"><use href="#i-live"/></svg><span>Live file</span></button>
        <button class="tool" data-tool="watch" title="Watch a folder; new files appear here"><svg class="ic"><use href="#i-watch"/></svg><span>Watch</span></button>
      </div>

      <div id="fmttools" class="seltools fmt" hidden>
        <button data-fmt="bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button data-fmt="italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <button data-fmt="underline" title="Underline (Ctrl+U)"><u>U</u></button>
        <button data-fmt="strikeThrough" title="Strikethrough"><s>S</s></button>
        <span class="fsep"></span>
        <button data-fmt="insertUnorderedList" title="Bullet list">&bull;&#8212;</button>
        <button data-fmt="insertOrderedList" title="Numbered list">1&#8212;</button>
        <span class="fsep"></span>
        <button data-fmt="color" title="Text colour" class="fcolor"><b>A</b></button>
        <button data-fmt="link" title="Link (Ctrl+K)"><svg class="ic"><use href="#i-link"/></svg></button>
        <button data-fmt="removeFormat" title="Clear formatting">&#10005;</button>
      </div>
      <div id="textcolors" class="textcolors" hidden></div>

      <!-- Left contextual toolbar: the rail swaps to these actions when a card
           is selected (Milanote style). -->
      <div id="selrail" class="rail selrail" hidden>
        <button class="tool" data-sel="color" title="Colour"><span class="selswatch"></span><span>Colour</span></button>
        <button class="tool" data-sel="icon" title="Set icon"><span class="selemoji">&#128512;</span><span>Icon</span></button>
        <button class="tool" data-sel="rename" title="Rename"><svg class="ic"><use href="#i-pencil"/></svg><span>Rename</span></button>
        <button class="tool" data-sel="dup" title="Duplicate (Ctrl+D)"><svg class="ic"><use href="#i-copy"/></svg><span>Copy</span></button>
        <span class="rail-sep"></span>
        <button class="tool danger" data-sel="del" title="Delete"><svg class="ic"><use href="#i-trash"/></svg><span>Delete</span></button>
      </div>
      <div id="colorpop" class="textcolors" hidden></div>

      <div id="present-hud" hidden>
        <span id="present-step"></span>
        <span class="dim">arrows to step &middot; Home fits all &middot; Esc exits</span>
      </div>

      <div id="empty-hint">
        <p>Drag a tool from the left onto the board.</p>
        <p class="dim">Or drop in images and files, or paste a link.</p>
        <button id="empty-template">Start from a template</button>
      </div>
    </div>
  </div>
</div>

<div id="tpl" hidden>
  <div class="pbox">
    <header class="phead">
      <h1 id="tpl-title">Start from a template</h1>
      <div class="spacer"></div>
      <button id="tpl-close" class="ghost" title="Close">&times;</button>
    </header>
    <div class="tcats"></div>
    <div class="tgrid"></div>
  </div>
</div>

<div id="picker" hidden>
  <div class="pbox">
    <header class="phead">
      <h1>Projects</h1>
      <div class="spacer"></div>
      <button id="picker-backup" class="ghost pbackup">Back up now</button>
      <button id="picker-new" class="pnew">New project</button>
      <button id="picker-close" class="ghost" title="Close">&times;</button>
    </header>
    <div class="pgrid"></div>
    <footer class="pfoot">
      <span>Muse <span id="app-build">…</span> &middot; folder <span id="picker-root"></span></span>
      <span id="backup-info" class="backup-info"></span>
    </footer>
  </div>
</div>

<div id="update-bar" hidden>
  <span id="update-text">A new version of Muse is available.</span>
  <button id="update-now">Update now</button>
  <button id="update-later" class="ghost">Later</button>
</div>
